<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#f5f0e8;--warm:#e8ddd0;--dark:#1a1714;--muted:#7a6f65;--gold:#c9956a;--gold2:#e8c9a0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--dark);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;}
.cover{position:fixed;inset:0;z-index:200;background:var(--dark);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s ease,transform .7s ease;}
.cover.cover-exit{opacity:0;transform:translateY(-40px);pointer-events:none;}
.frame-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem;animation:fadeUp 1s .3s both;}

.frame{position:relative;width:min(72vw,340px);aspect-ratio:4/3;border:2px solid var(--gold);padding:10px;background:#111;}
.frame::before{content:'';position:absolute;inset:5px;border:1px solid rgba(201,149,106,.45);pointer-events:none;}
.frame::after{content:'';position:absolute;inset:-6px;border:1px solid rgba(201,149,106,.2);pointer-events:none;}
.corner{position:absolute;width:18px;height:18px;border-color:var(--gold2);border-style:solid;opacity:.8;}
.corner.tl{top:-2px;left:-2px;border-width:2px 0 0 2px;}.corner.tr{top:-2px;right:-2px;border-width:2px 2px 0 0;}
.corner.bl{bottom:-2px;left:-2px;border-width:0 0 2px 2px;}.corner.br{bottom:-2px;right:-2px;border-width:0 2px 2px 0;}
.frame-inner{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.frame-inner img{width:100%;height:100%;object-fit:cover;}
.frame-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;color:var(--muted);text-align:center;padding:1rem;}
.frame-placeholder .ph-icon{font-size:2rem;opacity:.4;}
.frame-placeholder .ph-main{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--gold2);opacity:.7;line-height:1.4;}
.frame-placeholder .ph-sub{font-size:.65rem;color:var(--muted);letter-spacing:.06em;opacity:.6;}
.frame-hint{display:flex;align-items:center;gap:.8rem;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);animation:pulse 2s 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
.notif-bar{position:fixed;top:1.2rem;right:-420px;z-index:500;background:rgba(26,23,20,.95);border-left:2px solid var(--gold);padding:.5rem 1.1rem;font-size:.75rem;letter-spacing:.06em;color:var(--cream);white-space:nowrap;transition:right .5s cubic-bezier(.22,1,.36,1);border-radius:0 3px 3px 0;pointer-events:none;}
.notif-bar.show{right:0;}
.main-hidden{display:none;}
.main-enter{display:block;animation:fadeUp .9s ease both;}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(201,149,106,.1) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
.hero-label{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;animation:fadeUp .8s .2s both;}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:clamp(3.5rem,10vw,7rem);font-weight:300;line-height:1;letter-spacing:-.02em;animation:fadeUp .8s .4s both;}
.hero-name em{font-style:italic;color:var(--gold);}
.hero-sub{margin-top:1.5rem;font-size:.85rem;color:var(--muted);letter-spacing:.05em;animation:fadeUp .8s .6s both;}
.scroll-hint{position:absolute;bottom:2rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);animation:fadeUp .8s 1s both;}
.scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollPulse 2s 1.5s infinite;}

.messages-section{background:var(--dark);padding:5rem 2rem 4rem;text-align:center;position:relative;overflow:hidden;}
.messages-section::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(201,149,106,.06) 0%,transparent 70%);pointer-events:none;}
.msg-section-label{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:2.5rem;}
.msg-stage{max-width:680px;margin:0 auto;position:relative;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
.quote-mark{font-family:'Cormorant Garamond',serif;font-size:8rem;line-height:.6;color:var(--gold);opacity:.13;position:absolute;top:0;left:0;user-select:none;pointer-events:none;}
.msg-tap{position:absolute;top:0;bottom:0;width:40%;cursor:pointer;z-index:2;}
.msg-tap.prev{left:0;}.msg-tap.next{right:0;}
.msg-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,3vw,1.55rem);font-weight:300;font-style:italic;color:var(--cream);line-height:1.8;position:relative;z-index:1;padding:0 1rem;white-space:pre-line;transition:opacity .35s ease,transform .35s ease;}
.msg-text.fade-out{opacity:0;transform:translateY(8px);}
.msg-text.fade-in{animation:fadeUp .45s ease both;}
.msg-progress-wrap{width:100%;max-width:300px;height:1px;background:rgba(255,255,255,.1);margin-top:1.2rem;border-radius:1px;overflow:hidden;transition:opacity .3s;}
.msg-bar{height:100%;width:0%;background:var(--gold);border-radius:1px;}
.msg-dots{display:flex;justify-content:center;gap:6px;margin-top:.9rem;flex-wrap:wrap;}
.msg-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(201,149,106,.4);cursor:pointer;transition:background .3s,transform .3s;}
.msg-dot.active{background:var(--gold);border-color:var(--gold);transform:scale(1.35);}
.msg-count{font-size:.65rem;color:var(--muted);letter-spacing:.1em;margin-top:.3rem;}
.msg-controls{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;position:relative;z-index:3;}
.msg-arrow{background:none;border:1px solid rgba(201,149,106,.4);color:var(--gold);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:background .2s;user-select:none;}
.msg-arrow:hover{background:rgba(201,149,106,.15);}
.msg-hold{background:none;border:1px solid rgba(201,149,106,.3);color:rgba(201,149,106,.7);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;user-select:none;transition:background .2s,color .2s;letter-spacing:-.02em;}
.msg-hold:active,.msg-hold.held{background:rgba(201,149,106,.15);color:var(--gold);border-color:var(--gold);}
.section-divider{display:flex;align-items:center;gap:1rem;max-width:720px;margin:0 auto;padding:2rem;}
.divider-line{flex:1;height:1px;background:var(--warm);}
.divider-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;color:var(--muted);white-space:nowrap;}
.person{padding:3.5rem 2rem;max-width:720px;margin:0 auto;}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
.person-header{display:flex;align-items:baseline;gap:.8rem;margin-bottom:1.6rem;padding-bottom:.8rem;border-bottom:1px solid var(--warm);}
.person-num{font-family:'Cormorant Garamond',serif;font-size:.9rem;color:var(--gold);font-style:italic;}
.person-name{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:300;}
.slideshow{position:relative;width:100%;aspect-ratio:4/3;border-radius:5px;overflow:hidden;background:var(--warm);}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease-in-out;}
.slide.active{opacity:1;}
.slide img{width:100%;height:100%;object-fit:cover;display:block;}
.slide-loading{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem;letter-spacing:.1em;background:var(--warm);}
.slide-tap{position:absolute;top:0;bottom:0;width:42%;z-index:5;cursor:pointer;}
.slide-tap.prev{left:0;}.slide-tap.next{right:0;}
.slide-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:6;background:rgba(26,23,20,.45);border:none;color:white;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;}
.slideshow:hover .slide-btn{opacity:1;}
.slide-btn.prev{left:.6rem;}.slide-btn.next{right:.6rem;}
.slide-controls{position:absolute;bottom:.7rem;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;}
.slide-dots-row{display:flex;gap:5px;pointer-events:all;flex-wrap:wrap;justify-content:center;padding:0 2rem;}
.photo-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:background .3s,transform .3s;}
.photo-dot.active{background:white;transform:scale(1.4);}
.slide-count-label{font-size:.6rem;color:rgba(255,255,255,.6);letter-spacing:.06em;}
.finale{text-align:center;padding:5rem 2rem 6rem;}
.finale-text{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,7vw,4.5rem);font-weight:300;font-style:italic;line-height:1.3;}
.finale-text em{color:var(--gold);}
.finale-sub{margin-top:1.2rem;font-size:.78rem;color:var(--muted);letter-spacing:.12em;}
.dl-row{display:inline-flex;align-items:center;gap:.7rem;margin-top:2rem;}
.dl-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.3rem;border:1px solid rgba(201,149,106,.45);color:var(--gold);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;border-radius:20px;cursor:pointer;background:none;transition:background .2s,border-color .2s;font-family:'DM Sans',sans-serif;font-weight:300;}
.dl-btn:hover{background:rgba(201,149,106,.1);border-color:var(--gold);}
.toggle-wrap{position:relative;display:inline-block;width:34px;height:19px;cursor:pointer;flex-shrink:0;}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{position:absolute;inset:0;background:rgba(201,149,106,.15);border:1px solid rgba(201,149,106,.3);border-radius:20px;transition:background .3s,border-color .3s;}
.toggle-thumb{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--muted);top:2px;left:2px;transition:transform .3s,background .3s;}
.toggle-wrap input:checked~.toggle-track{background:rgba(201,149,106,.25);border-color:var(--gold);}
.toggle-wrap input:checked~.toggle-thumb{transform:translateX(15px);background:var(--gold);}
.vol-wrap{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-top:1.6rem;}
.vol-btn{background:none;border:1px solid rgba(201,149,106,.4);color:var(--gold);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;}
.vol-btn:hover{background:rgba(201,149,106,.12);}
.vol-icon{font-size:.85rem;}
.vol-slider{-webkit-appearance:none;appearance:none;width:180px;height:2px;background:rgba(201,149,106,.2);border-radius:2px;outline:none;cursor:pointer;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 6px rgba(201,149,106,.5);}
.vol-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;}
.random-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.2rem;padding:.6rem 1.8rem;border:1px solid rgba(201,149,106,.5);color:var(--gold);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;border-radius:20px;cursor:pointer;background:none;transition:background .2s;font-family:'DM Sans',sans-serif;font-weight:300;}
.random-btn:hover{background:rgba(201,149,106,.1);}
.collage-overlay{display:none;position:fixed;inset:0;z-index:600;background:rgba(26,23,20,.92);align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto;}
.collage-overlay.open{display:flex;}
.collage-box{background:var(--cream);border-radius:6px;padding:2rem;max-width:620px;width:100%;position:relative;max-height:90vh;overflow-y:auto;}
.collage-close{position:absolute;top:.8rem;right:.8rem;background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);}
.collage-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-style:italic;color:var(--dark);margin-bottom:1.2rem;text-align:center;}
.ratio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
.ratio-btn{border:1px solid var(--warm);background:none;padding:.5rem .3rem;border-radius:4px;cursor:pointer;font-size:.65rem;letter-spacing:.03em;color:var(--muted);transition:border-color .2s,color .2s,background .2s;line-height:1.5;text-align:center;white-space:pre-line;}
.ratio-btn:hover,.ratio-btn.selected{border-color:var(--gold);color:var(--gold);background:rgba(201,149,106,.07);}
.collage-preview{margin-top:1.2rem;text-align:center;}
.collage-preview canvas{max-width:100%;border-radius:4px;display:block;margin:0 auto;}
.collage-generating{text-align:center;padding:2rem;font-size:.8rem;color:var(--muted);letter-spacing:.1em;}
.collage-dl-row{display:flex;justify-content:center;margin-top:1rem;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:600px){.slideshow{aspect-ratio:1/1;}.frame{width:min(80vw,300px);}.ratio-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

  {name:'L判スナップ',w:89,h:127},{name:'2L判スナップ',w:42,h:59},
  {name:'ポラロイド',w:77,h:78},{name:'フォトフレーム',w:89,h:125},
  {name:'写真立て·横',w:60,h:37},{name:'写真立て·縦',w:77,h:115},
  {name:'透明フォトフレーム',w:44,h:63},{name:'透明写真立て·横',w:127,h:87},
  {name:'透明写真立て·縦',w:89,h:125},{name:'お花フォトフレーム',w:127,h:178},
  {name:'お花写真立て·横',w:178,h:125},{name:'お花写真立て·縦',w:127,h:175},
  {name:'三角写真立て',w:57,h:82},
];
(function(){
  const img=document.getElementById('frame-photo');
  const ph=document.getElementById('frame-placeholder');
  if(!CONFIG.groupPhoto)return;
  img.src=CONFIG.groupPhoto;
  img.onload=()=>{ph.style.display='none';img.style.display='block';};
})();
function showNotif(){
  const bar=document.getElementById('notif-bar');
  bar.classList.add('show');
  setTimeout(()=>bar.classList.remove('show'),2000);
}
function enterSite(){
  document.getElementById('cover').classList.add('cover-exit');
  setTimeout(()=>{
    document.getElementById('cover').style.display='none';
    const main=document.getElementById('main');
    main.classList.remove('main-hidden');main.classList.add('main-enter');
    buildPersons();initReveal();
    document.getElementById('doorbell').play().catch(()=>{});
    showNotif();
    const bgm=document.getElementById('bgm');
    bgm.volume=0;bgm.play().catch(()=>{});
    document.getElementById('audio-btn').textContent='❚❚';
    let v=0;
    const fi=setInterval(()=>{v=Math.min(v+0.006,0.15);bgm.volume=v;document.getElementById('audio-vol').value=v;if(v>=0.15)clearInterval(fi);},80);
  },750);
}
function toggleAudio(){
  const bgm=document.getElementById('bgm'),btn=document.getElementById('audio-btn');
  if(bgm.paused){bgm.play();btn.textContent='❚❚';}else{bgm.pause();btn.textContent='▶';}
}
function setVolume(v){document.getElementById('bgm').volume=v;}
function updateDlTarget(){
  const on=document.getElementById('dl-toggle').checked;
  const btn=document.getElementById('dl-btn');
  btn.href=on?'s111.png':'mahoro20260518a.png';
  btn.download=on?'集合写真.png':'mahoro20260518a.png';
}
const msgs=CONFIG.messages;
let msgCur=0,msgTimer;
const MSG_IV=6000;
(function(){
  const textEl=document.getElementById('msg-text');
  const barEl=document.getElementById('msg-bar');
  const dotsEl=document.getElementById('msg-dots');
  const countEl=document.getElementById('msg-count');
  msgs.forEach((_,i)=>{
    const d=document.createElement('span');
    d.className='msg-dot'+(i===0?' active':'');
    d.addEventListener('click',()=>{clearInterval(msgTimer);msgGoTo(i);msgStartTimer();});
    dotsEl.appendChild(d);
  });
  window.msgGoTo=function(n){
    textEl.classList.add('fade-out');
    setTimeout(()=>{
      msgCur=(n+msgs.length)%msgs.length;
      textEl.textContent=msgs[msgCur];
      textEl.classList.remove('fade-out');textEl.classList.add('fade-in');
      setTimeout(()=>textEl.classList.remove('fade-in'),500);
      dotsEl.querySelectorAll('.msg-dot').forEach((d,i)=>d.classList.toggle('active',i===msgCur));
      countEl.textContent=(msgCur+1)+' / '+msgs.length;
      barEl.style.transition='none';barEl.style.width='0%';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        barEl.style.transition='width '+MSG_IV+'ms linear';barEl.style.width='100%';
      }));
    },350);
  };
  window.msgNext=()=>{clearInterval(msgTimer);msgGoTo(msgCur+1);msgStartTimer();};
  window.msgPrev=()=>{clearInterval(msgTimer);msgGoTo(msgCur-1);msgStartTimer();};
  window.msgStartTimer=()=>{msgTimer=setInterval(()=>msgGoTo(msgCur+1),MSG_IV);};
  textEl.textContent=msgs[0];countEl.textContent='1 / '+msgs.length;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{barEl.style.transition='width '+MSG_IV+'ms linear';barEl.style.width='100%';}));
  msgStartTimer();
})();
function holdPause(){
  clearInterval(msgTimer);
  document.getElementById('msg-progress-wrap').style.opacity='0';
  document.getElementById('msg-hold-btn').classList.add('held');
}
function releasePause(){
  document.getElementById('msg-progress-wrap').style.opacity='1';
  document.getElementById('msg-hold-btn').classList.remove('held');
  msgStartTimer();
}
const personStates={};
function tryPhoto(letter,n){
  const base=(CONFIG.photoDir||'')+letter+n;
  return new Promise(resolve=>{
    const a=new Image();
    a.onload=()=>resolve(base+'.jpg');
    a.onerror=()=>{
      const b=new Image();b.onload=()=>resolve(base+'.JPG');
      b.onerror=()=>{const c=new Image();c.onload=()=>resolve(base+'.png');c.onerror=()=>resolve(null);c.src=base+'.png';};
      b.src=base+'.JPG';
    };
    a.src=base+'.jpg';
  });
}
function initPersonSections(){
  const container=document.getElementById('persons-container');
  Object.entries(CONFIG.people).forEach(([key,person],idx)=>{
    if(idx>0){
      const dv=document.createElement('div');dv.className='section-divider';
      dv.innerHTML='<span class="divider-line"></span><span class="divider-text">✦</span><span class="divider-line"></span>';
      container.appendChild(dv);
    }
    const sec=document.createElement('section');sec.className='person reveal';
    sec.innerHTML=
      '<div class="person-header"><span class="person-num">'+String(idx+1).padStart(2,'0')+'.</span>'+
      '<span class="person-name">'+(person.name||key.toUpperCase()+'さん')+'</span></div>'+
      '<div class="slideshow"><div class="slides-wrap"><div class="slide-loading">思い出パンク中...</div></div>'+
      '<button class="slide-btn prev">&#8592;</button><button class="slide-btn next">&#8594;</button>'+
      '<div class="slide-tap prev"></div><div class="slide-tap next"></div>'+
      '<div class="slide-controls"><div class="slide-dots-row"></div><div class="slide-count-label"></div></div></div>';
    container.appendChild(sec);
    const wrap=sec.querySelector('.slides-wrap'),dotsRow=sec.querySelector('.slide-dots-row');
    const countLbl=sec.querySelector('.slide-count-label');
    const btnPrev=sec.querySelector('.slide-btn.prev'),btnNext=sec.querySelector('.slide-btn.next');
    const tapPrev=sec.querySelector('.slide-tap.prev'),tapNext=sec.querySelector('.slide-tap.next');
    const st={wrap,dotsRow,countLbl,count:0,cur:0,timer:null,started:false,photos:[]};
    personStates[key]=st;
    function jump(n){
      const slides=wrap.querySelectorAll('.slide'),dots=dotsRow.querySelectorAll('.photo-dot');
      if(!slides.length)return;
      slides[st.cur].classList.remove('active');dots[st.cur].classList.remove('active');
      st.cur=(n+st.count)%st.count;
      slides[st.cur].classList.add('active');dots[st.cur].classList.add('active');
      countLbl.textContent=(st.cur+1)+' / '+st.count;
    }
    st.jump=jump;
    function startAuto(){st.timer=setInterval(()=>{if(st.count>1)jump(st.cur+1);},3500+idx*150);}
    st.startAuto=startAuto;
    function next(){clearInterval(st.timer);jump(st.cur+1);startAuto();}
    function prev(){clearInterval(st.timer);jump(st.cur-1);startAuto();}
    btnNext.addEventListener('click',next);tapNext.addEventListener('click',next);
    btnPrev.addEventListener('click',prev);tapPrev.addEventListener('click',prev);
  });
}
function appendPhoto(key,src){
  const st=personStates[key];if(!st)return;
  const i=st.count++;st.photos.push(src);
  if(i===0){const l=st.wrap.querySelector('.slide-loading');if(l)l.remove();}
  const slide=document.createElement('div');slide.className='slide'+(i===0?' active':'');
  const img=document.createElement('img');img.src=src;img.alt='';
  slide.appendChild(img);st.wrap.appendChild(slide);
  const dot=document.createElement('span');dot.className='photo-dot'+(i===0?' active':'');
  dot.addEventListener('click',()=>st.jump(i));st.dotsRow.appendChild(dot);
  st.countLbl.textContent=(st.cur+1)+' / '+st.count;
  if(!st.started){st.started=true;st.startAuto();}
}
async function buildPersons(){
  initPersonSections();initReveal();
  const keys=Object.keys(CONFIG.people);
  for(let n=1;n<=CONFIG.maxPhotos;n++){
    await Promise.all(keys.map(key=>tryPhoto(key,n).then(src=>{if(src)appendPhoto(key,src);})));
  }
}
function initReveal(){
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:0.08});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}
(function(){
  const grid=document.getElementById('ratio-grid');
  RATIOS.forEach(r=>{
    const btn=document.createElement('button');btn.className='ratio-btn';
    btn.textContent=r.name+'\n'+r.w+':'+r.h;
    btn.addEventListener('click',()=>{
      grid.querySelectorAll('.ratio-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');generateCollage(r);
    });
    grid.appendChild(btn);
  });
})();
function getRandomPhotos(){
  return Object.entries(CONFIG.people).map(([key,person])=>{
    const st=personStates[key];
    if(!st||!st.photos.length)return null;
    return{name:person.name||key,src:st.photos[Math.floor(Math.random()*st.photos.length)]};
  }).filter(Boolean);
}
function loadImg(src){
  return new Promise(resolve=>{
    const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src;
  });
}
let currentCanvas=null;
async function generateCollage(ratio){
  const preview=document.getElementById('collage-preview');
  const dlRow=document.getElementById('collage-dl-row');
  preview.innerHTML='<div class="collage-generating">思い出を並べています...</div>';
  dlRow.style.display='none';
  const BASE=2400;
  let cW,cH;
  if(ratio.w>=ratio.h){cW=BASE;cH=Math.round(BASE*ratio.h/ratio.w);}
  else{cH=BASE;cW=Math.round(BASE*ratio.w/ratio.h);}
  const photos=getRandomPhotos();
  const images=await Promise.all(photos.map(p=>loadImg(p.src)));
  const canvas=document.createElement('canvas');
  canvas.width=cW;canvas.height=cH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,cW,cH);
  const headerH=Math.floor(cH*0.13);
  ctx.fillStyle='#1a1714';ctx.fillRect(0,0,cW,headerH);
  ctx.strokeStyle='rgba(201,149,106,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cW*0.07,headerH-8);ctx.lineTo(cW*0.93,headerH-8);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#e8c9a0';
  ctx.font='italic '+Math.floor(cH*0.045)+'px Georgia,serif';
  ctx.fillText('Happy Birthday, dear Mahoro',cW/2,Math.floor(headerH*0.55));
  ctx.font=Math.floor(cH*0.017)+'px Arial,sans-serif';
  ctx.fillStyle='rgba(201,149,106,0.7)';
  ctx.fillText('2026   05   29',cW/2,Math.floor(headerH*0.82));
  const pad=Math.floor(cW*0.007);
  const gridTop=headerH+pad;
  const availW=cW-pad*2;
  const availH=cH-gridTop-pad;
  const rowConfig=[2,3,4,4];
  const rowCount=rowConfig.length;
  const rowH=Math.floor((availH-pad*(rowCount-1))/rowCount);
  let pi=0;
  rowConfig.forEach((count,ri)=>{
    const y=gridTop+ri*(rowH+pad);
    const rowItems=[];
    for(let j=0;j<count&&pi<photos.length;j++,pi++){
      const img=images[pi];
      const ar=img?(img.naturalWidth/img.naturalHeight):1.5;
      rowItems.push({p:photos[pi],img,ar});
    }
    const totalAR=rowItems.reduce((s,x)=>s+x.ar,0);
    const gapW=pad*(rowItems.length-1);
    let xOff=pad;
    rowItems.forEach((item,j)=>{
      const isLast=j===rowItems.length-1;
      const w=isLast?(cW-pad-xOff):Math.floor((availW-gapW)*item.ar/totalAR);
      if(item.img){
        ctx.save();ctx.beginPath();ctx.rect(xOff,y,w,rowH);ctx.clip();
        const sc=Math.max(w/item.img.naturalWidth,rowH/item.img.naturalHeight);
        const dW=item.img.naturalWidth*sc,dH=item.img.naturalHeight*sc;
        ctx.drawImage(item.img,xOff+(w-dW)/2,y+(rowH-dH)/2,dW,dH);
        ctx.restore();
      }
      const ns=Math.max(Math.floor(cH*0.019),13);
      ctx.font=ns+'px Arial,sans-serif';
      const tw=ctx.measureText(item.p.name).width;
      const np=Math.floor(ns*0.45);
      ctx.fillStyle='rgba(26,23,20,0.55)';
      ctx.fillRect(xOff,y,tw+np*2,ns+np*1.6);
      ctx.fillStyle='rgba(232,201,160,0.95)';ctx.textAlign='left';
      ctx.fillText(item.p.name,xOff+np,y+ns);
      xOff+=w+pad;
    });
  });
  canvas.style.maxWidth='100%';canvas.style.borderRadius='4px';
  preview.innerHTML='';preview.appendChild(canvas);
  currentCanvas=canvas;dlRow.style.display='flex';
}
function downloadCollage(){
  if(!currentCanvas)return;
  const a=document.createElement('a');
  a.download='mahoro_birthday_collage.png';
  a.href=currentCanvas.toDataURL('image/png');a.click();
}
function openCollage(){document.getElementById('collage-overlay').classList.add('open');}
function closeCollage(){document.getElementById('collage-overlay').classList.remove('open');}
</script>
