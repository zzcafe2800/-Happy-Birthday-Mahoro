<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday まほろさん</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f5f0e8;
  --warm:  #e8ddd0;
  --dark:  #1a1714;
  --muted: #7a6f65;
  --gold:  #c9956a;
  --gold2: #e8c9a0;
}
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--dark);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
}

/* ══════════════ COVER ══════════════ */
.cover {
  position: fixed; inset: 0; z-index: 200;
  background: var(--dark);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.cover.cover-exit {
  opacity: 0;
  transform: translateY(-40px);
  pointer-events: none;
}

/* frame outer */
.frame-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 1.4rem;
  padding: 2rem;
  animation: fadeUp 1s 0.3s both;
}
.cover-title {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: var(--gold2);
  letter-spacing: 0.08em;
  opacity: 0.85;
}

/* picture frame */
.frame {
  position: relative;
  width: min(72vw, 340px);
  aspect-ratio: 4/3;
  border: 2px solid var(--gold);
  padding: 10px;
  background: #111;
}
.frame::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(201,149,106,0.45);
  pointer-events: none;
}
/* corner ornaments */
.frame::after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 1px solid rgba(201,149,106,0.2);
  pointer-events: none;
}
.corner {
  position: absolute;
  width: 18px; height: 18px;
  border-color: var(--gold2);
  border-style: solid;
  opacity: 0.8;
}
.corner.tl { top: -2px;  left: -2px;  border-width: 2px 0 0 2px; }
.corner.tr { top: -2px;  right: -2px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: -2px; left: -2px;  border-width: 0 0 2px 2px; }
.corner.br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

.frame-inner {
  width: 100%; height: 100%;
  overflow: hidden;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.frame-inner img { width: 100%; height: 100%; object-fit: cover; }

/* placeholder inside frame */
.frame-placeholder {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.6rem;
  color: var(--muted);
  text-align: center;
  padding: 1rem;
}
.frame-placeholder .ph-icon { font-size: 2rem; opacity: 0.4; }
.frame-placeholder .ph-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--gold2);
  opacity: 0.7;
  line-height: 1.4;
}
.frame-placeholder .ph-sub {
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.06em;
  opacity: 0.6;
}

.frame-hint {
  display: flex; align-items: center; gap: 0.8rem;
  font-size: 0.65rem; letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  animation: pulse 2s 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

/* ══════════════ MAIN ══════════════ */
.main-hidden { display: none; }
.main-enter  { display: block; animation: fadeUp 0.9s ease both; }

/* ══════════════ HERO ══════════════ */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 2rem;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,149,106,0.1) 0%, transparent 70%);
  top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events: none;
}
.hero-label {
  font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 1.5rem;
  animation: fadeUp 0.8s 0.2s both;
}
.hero-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3.5rem, 10vw, 7rem);
  font-weight: 300; line-height: 1; letter-spacing: -0.02em;
  animation: fadeUp 0.8s 0.4s both;
}
.hero-name em { font-style: italic; color: var(--gold); }
.hero-sub {
  margin-top: 1.5rem; font-size: 0.85rem;
  color: var(--muted); letter-spacing: 0.05em;
  animation: fadeUp 0.8s 0.6s both;
}
.scroll-hint {
  position: absolute; bottom: 2rem;
  display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); animation: fadeUp 0.8s 1s both;
}
.scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(to bottom, var(--gold), transparent);
  animation: scrollPulse 2s 1.5s infinite;
}
@keyframes scrollPulse { 0%,100%{opacity:.3;} 50%{opacity:1;} }

/* ══════════════ MESSAGE SLIDESHOW ══════════════ */
.messages-section {
  background: var(--dark);
  padding: 5rem 2rem 4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.messages-section::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(201,149,106,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.msg-section-label {
  font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); opacity: 0.7; margin-bottom: 2.5rem;
}
.msg-stage {
  max-width: 680px; margin: 0 auto;
  position: relative; min-height: 200px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1rem;
}
.quote-mark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 8rem; line-height: 0.6;
  color: var(--gold); opacity: 0.15;
  position: absolute; top: 0; left: 0;
  user-select: none; pointer-events: none;
}
.msg-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.2rem, 3vw, 1.6rem);
  font-weight: 300; font-style: italic;
  color: var(--cream); line-height: 1.8;
  position: relative; z-index: 1;
  padding: 0 1rem;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.msg-text.fade-out { opacity: 0; transform: translateY(8px); }
.msg-text.fade-in  { animation: fadeUp 0.5s ease both; }

.msg-progress-wrap {
  width: 100%; max-width: 300px;
  height: 1px; background: rgba(255,255,255,0.1);
  margin-top: 1.5rem; border-radius: 1px; overflow: hidden;
}
.msg-bar {
  height: 100%; width: 0%;
  background: var(--gold);
  border-radius: 1px;
}
.msg-dots {
  display: flex; justify-content: center; gap: 6px; margin-top: 1rem;
}
.msg-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(201,149,106,0.4);
  cursor: pointer;
  transition: background 0.3s, transform 0.3s;
}
.msg-dot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.35); }
.msg-count { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; margin-top: 0.4rem; }

/* ══════════════ SECTION DIVIDER ══════════════ */
.section-divider {
  display: flex; align-items: center; gap: 1rem;
  max-width: 720px; margin: 0 auto; padding: 2rem 2rem;
}
.divider-line { flex: 1; height: 1px; background: var(--warm); }
.divider-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 0.95rem;
  color: var(--muted); white-space: nowrap;
}

/* ══════════════ PERSON ══════════════ */
.person {
  padding: 3.5rem 2rem;
  max-width: 720px; margin: 0 auto;
}
.reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

.person-header {
  display: flex; align-items: baseline; gap: 0.8rem;
  margin-bottom: 1.6rem; padding-bottom: 0.8rem;
  border-bottom: 1px solid var(--warm);
}
.person-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.9rem; color: var(--gold); font-style: italic;
}
.person-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.7rem; font-weight: 300;
}

/* ══════════════ SLIDESHOW ══════════════ */
.slideshow {
  position: relative; width: 100%; aspect-ratio: 4/3;
  border-radius: 5px; overflow: hidden; background: var(--warm);
}
.slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 1.6s ease-in-out;
}
.slide.active { opacity: 1; }
.slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0.5rem;
  background: linear-gradient(135deg, var(--warm) 0%, #d8cfc4 100%);
  color: var(--muted); font-size: 0.72rem; letter-spacing: 0.1em;
}
.slide-placeholder .ph-icon-sm { font-size: 1.6rem; opacity: 0.4; }

.slide-controls {
  position: absolute; bottom: 0.8rem; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.slide-dots-row { display: flex; gap: 5px; }
.photo-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.35);
  cursor: pointer; transition: background 0.3s, transform 0.3s;
}
.photo-dot.active { background: white; transform: scale(1.4); }
.slide-count-label {
  font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 0.06em;
}

/* ══════════════ FINALE ══════════════ */
.finale {
  text-align: center; padding: 7rem 2rem;
}
.finale-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.2rem, 7vw, 4.5rem);
  font-weight: 300; font-style: italic; line-height: 1.3;
}
.finale-text em { color: var(--gold); }
.finale-sub {
  margin-top: 1.2rem; font-size: 0.78rem;
  color: var(--muted); letter-spacing: 0.12em;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}
@media(max-width:600px){
  .slideshow{ aspect-ratio: 1/1; }
  .frame{ width: min(80vw, 300px); }
}
</style>
</head>
<body>

<!-- ════ COVER ════ -->
<div id="cover" class="cover" onclick="enterSite()">
  <div class="frame-wrap">
    <p class="cover-title">Happy Birthday — まほろさん</p>

    <div class="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="frame-inner">
        <!-- 集合写真が設定されていないときのプレースホルダー -->
        <div id="frame-placeholder" class="frame-placeholder">
          <span class="ph-icon">📸</span>
          <span class="ph-main">お誕生日会<br>集合写真</span>
          <span class="ph-sub">（会のあとに写真が入ります）</span>
        </div>
        <!-- 集合写真あり: groupPhoto を設定すると自動で表示 -->
        <img id="frame-photo" src="" alt="集合写真" style="display:none;width:100%;height:100%;object-fit:cover;">
      </div>
    </div>

    <div class="frame-hint">✦&nbsp;&nbsp;タップして開く&nbsp;&nbsp;✦</div>
  </div>
</div>

<!-- ════ MAIN ════ -->
<div id="main" class="main-hidden">

  <!-- HERO -->
  <section class="hero">
    <p class="hero-label">Happy Birthday</p>
    <h1 class="hero-name">まほろ<em>さんへ</em></h1>
    <p class="hero-sub">コミュニティのみんなからのメッセージ</p>
    <div class="scroll-hint">
      <div class="scroll-line"></div>
      <span>Scroll</span>
    </div>
  </section>

  <!-- MESSAGE SLIDESHOW -->
  <section class="messages-section">
    <p class="msg-section-label">みんなのきもち</p>
    <div class="msg-stage">
      <div class="quote-mark">"</div>
      <div id="msg-text" class="msg-text"></div>
      <div class="msg-progress-wrap">
        <div id="msg-bar" class="msg-bar"></div>
      </div>
      <div id="msg-dots" class="msg-dots"></div>
      <div id="msg-count" class="msg-count"></div>
    </div>
  </section>

  <!-- PHOTOS LABEL -->
  <div class="section-divider">
    <span class="divider-line"></span>
    <span class="divider-text">いっしょの おもいで</span>
    <span class="divider-line"></span>
  </div>

  <!-- PERSON SECTIONS (JS で生成) -->
  <div id="persons-container"></div>

  <!-- FINALE -->
  <section class="finale reveal">
    <p class="finale-text">みんなで、<em>おめでとう。</em></p>
    <p class="finale-sub">From コミュニティ一同 🎂</p>
  </section>

</div><!-- /main -->

<script>
/* ================================================================
   ✏️  CONFIG — ここだけ編集すれば OK です
================================================================ */
const CONFIG = {

  /* 誕生日の人の名前 */
  birthdayPerson: "まほろ",

  /* 🖼️ 集合写真
     誕生日会が終わったら "photos/group.jpg" のように入れてください
     空欄のままだとプレースホルダーが表示されます               */
  groupPhoto: "",

  /* 💬 みんなからのメッセージ
     名前が分からないのでまとめてスライドショー表示します        */
  messages: [
    "お誕生日おめでとう～！まほろさんが健やかで平穏に過ごせますように！",
    "まほっちゃお誕生日おめでと～！！ いつも元気を貰えてすごく感謝だよ～～！！ この一年毎日良い日を過ごしてね～！！ 辛い日があっても元気にしに行くよ！！ 改めておめでと～🎈🎈",
    "まほろさんお誕生日おめでとうー！🎂🎉 素敵な一年になりますように…！！",
    "まほろさんお誕生日おめでとう～～！🎉🎉 まほろさんにとって最高の一年になるようお祈りしています！🎂",
    "お誕生日おめでとう！！！ gogh復帰したときあたたかく迎えてくれてすごくうれしかったのずっと覚えてます！ まほろさんもアバターちゃんも大好きなのでこれからもいろんな時間を一緒に過ごせると嬉しいです🥰 楽しい一年にしようぞ✊",
    "誕生日おめでと〜！！まほさんの柔らかい雰囲気が癒し！！！ 素敵な一年にしてね🥳",
    "お誕生日おめでとうございます…！ 誰にでも優しくているだけでふわっと空気が和らぐまほろさんの存在にいつも癒されています❤️ まほろさんにとっても素敵な一年になりますように！",
    "まほちゃお誕生日おめでとう！✨🎊🎂🎊✨ 今年もいい年にしてね！いっぱいしあわせになって～！ またお部屋でいっぱいごろごろしよ～！🐾🎶",
    "まほろさん、お誕生日おめでとうございます！！ 良く一緒にいてくれて嬉しいです～ 楽しくて実りのある１年になりますように💕",
    "まほちゃんお誕生日おめでとうございます！いつも温かくて優しくて楽しいまほちゃんが大好き！！ 良い一年になりますように！♡",
    "まほろちゃん、お誕生日おめでとう！🎂🎉 幸多き一年になりますように！！🥳",
  ],

  /* 📸 写真ごとの人たち
     ─ キー: a, b, c ... アルファベット順
     ─ name: その人の名前（あとから入れても OK）
     ─ photos: ["a1.jpg","a2.jpg",...] → photos/ フォルダに置いてください
     ─ 追加する場合は下のコメントを参考に d: { ... } を足すだけ        */
  people: {
    a: {
      name: "Aさん",           // ← 名前を入れてください
      photos: ["a1.jpg","a2.jpg","a3.jpg"],
    },
    b: {
      name: "Bさん",
      photos: ["b1.jpg","b2.jpg","b3.jpg","b4.jpg"],
    },
    c: {
      name: "Cさん",
      photos: ["c1.jpg","c2.jpg"],
    },
    /* ↓ 新しい人を追加するときはここにコピペ
    d: {
      name: "Dさん",
      photos: ["d1.jpg","d2.jpg","d3.jpg"],
    },
    */
  },
};
/* ================================================================
   以下は編集不要です
================================================================ */

/* --- COVER --- */
if (CONFIG.groupPhoto.trim()) {
  document.getElementById('frame-placeholder').style.display = 'none';
  const img = document.getElementById('frame-photo');
  img.src = CONFIG.groupPhoto.trim();
  img.style.display = 'block';
}

function enterSite() {
  const cover = document.getElementById('cover');
  cover.classList.add('cover-exit');
  setTimeout(() => {
    cover.style.display = 'none';
    const main = document.getElementById('main');
    main.classList.remove('main-hidden');
    main.classList.add('main-enter');
    initReveal();
  }, 750);
}

/* --- MESSAGE SLIDESHOW --- */
(function() {
  const msgs    = CONFIG.messages;
  const textEl  = document.getElementById('msg-text');
  const barEl   = document.getElementById('msg-bar');
  const dotsEl  = document.getElementById('msg-dots');
  const countEl = document.getElementById('msg-count');
  const INTERVAL = 6000;
  let current = 0, timer;

  msgs.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'msg-dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => { clearInterval(timer); goTo(i); startTimer(); });
    dotsEl.appendChild(d);
  });

  function goTo(n) {
    textEl.classList.add('fade-out');
    setTimeout(() => {
      current = (n + msgs.length) % msgs.length;
      textEl.textContent = msgs[current];
      textEl.classList.remove('fade-out');
      textEl.classList.add('fade-in');
      setTimeout(() => textEl.classList.remove('fade-in'), 500);
      dotsEl.querySelectorAll('.msg-dot').forEach((d,i) => d.classList.toggle('active', i===current));
      countEl.textContent = (current+1) + ' / ' + msgs.length;
      barEl.style.transition = 'none'; barEl.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        barEl.style.transition = 'width ' + INTERVAL + 'ms linear';
        barEl.style.width = '100%';
      }));
    }, 400);
  }

  function startTimer() { timer = setInterval(() => goTo(current+1), INTERVAL); }

  textEl.textContent = msgs[0];
  countEl.textContent = '1 / ' + msgs.length;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    barEl.style.transition = 'width ' + INTERVAL + 'ms linear';
    barEl.style.width = '100%';
  }));
  startTimer();
})();

/* --- PERSON SECTIONS --- */
(function() {
  const container = document.getElementById('persons-container');
  const entries   = Object.entries(CONFIG.people);

  entries.forEach(([key, person], idx) => {
    if (idx > 0) {
      const dv = document.createElement('div');
      dv.className = 'section-divider';
      dv.innerHTML = '<span class="divider-line"></span><span class="divider-text">✦</span><span class="divider-line"></span>';
      container.appendChild(dv);
    }

    const sec = document.createElement('section');
    sec.className = 'person reveal';
    sec.innerHTML =
      '<div class="person-header">' +
        '<span class="person-num">' + String(idx+1).padStart(2,'0') + '.</span>' +
        '<span class="person-name">' + (person.name || key.toUpperCase()+'さん') + '</span>' +
      '</div>' +
      '<div class="slideshow">' +
        '<div class="slides-wrap"></div>' +
        '<div class="slide-controls">' +
          '<div class="slide-dots-row"></div>' +
          '<div class="slide-count-label"></div>' +
        '</div>' +
      '</div>';
    container.appendChild(sec);

    /* build slides */
    const wrap      = sec.querySelector('.slides-wrap');
    const dotsRow   = sec.querySelector('.slide-dots-row');
    const countLbl  = sec.querySelector('.slide-count-label');
    let cur = 0;

    person.photos.forEach((fname, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (i===0 ? ' active' : '');
      const img = document.createElement('img');
      img.alt = '';
      img.src = 'photos/' + fname;
      img.onerror = function() {
        slide.innerHTML =
          '<div class="slide-placeholder">' +
          '<span class="ph-icon-sm">📷</span>' +
          '<span>' + fname + '</span></div>';
      };
      slide.appendChild(img);
      wrap.appendChild(slide);

      const dot = document.createElement('span');
      dot.className = 'photo-dot' + (i===0 ? ' active' : '');
      dot.addEventListener('click', () => jump(i));
      dotsRow.appendChild(dot);
    });

    function jump(n) {
      wrap.querySelectorAll('.slide')[cur].classList.remove('active');
      dotsRow.querySelectorAll('.photo-dot')[cur].classList.remove('active');
      cur = (n + person.photos.length) % person.photos.length;
      wrap.querySelectorAll('.slide')[cur].classList.add('active');
      dotsRow.querySelectorAll('.photo-dot')[cur].classList.add('active');
      countLbl.textContent = (cur+1) + ' / ' + person.photos.length;
    }

    countLbl.textContent = '1 / ' + person.photos.length;
    const delay = 3200 + idx * 300 + Math.random() * 800;
    setInterval(() => jump(cur+1), delay);
  });
})();

/* --- SCROLL REVEAL --- */
function initReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}
</script>
